name: Scrape SuperDelivery

on:
  workflow_dispatch:
    inputs:
      category_url:
        description: "URL catégorie SuperDelivery à scraper"
        required: true
        type: string
      max_pages:
        description: "Nombre max de pages"
        required: false
        default: "3"
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer dépendances
        run: |
          pip install playwright supabase requests urllib3
          playwright install chromium --with-deps

      - name: Scraper (Mode Images: SUPABASE_STORAGE)
        env:
          SD_LOGIN: ${{ secrets.SD_LOGIN }}
          SD_PASSWORD: ${{ secrets.SD_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CATEGORY_URL: ${{ github.event.inputs.category_url }}
          MAX_PAGES: ${{ github.event.inputs.max_pages }}
          IMAGE_MODE: SUPABASE_STORAGE
        run: python superdelivery-v2.py

      - name: Upload backup artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: produits-sd
          path: produits.json
          retention-days: 7
